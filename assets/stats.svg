  <rect width="900" height="190" rx="14" fill="url(#statg)" stroke="#1E3A8A" stroke-width="1.5"/>
  <rect width="900" height="40" rx="14" fill="#0F172A"/><rect y="26" width="900" height="14" fill="#0F172A"/>
