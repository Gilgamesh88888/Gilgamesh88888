
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="panelg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080F20"/>
      <stop offset="0.55" stop-color="#101C3A"/>
      <stop offset="1" stop-color="#11152D"/>
    </linearGradient>
    <linearGradient id="lineg">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>

  <!-- Main panel -->
  <rect width="900" height="300" rx="14"
        fill="url(#panelg)" stroke="#263B68" stroke-width="1.3"/>

  <!-- Terminal header -->
  <path d="M14 0 H886 Q900 0 900 14 V40 H0 V14 Q0 0 14 0Z"
        fill="#0B1428"/>
  <path d="M0 40 H900" stroke="#263B50" stroke-width="1"/>

  <circle cx="26" cy="20" r="5" fill="#F87171"/>
  <circle cx="46" cy="20" r="5" fill="#FBBF24"/>
  <circle cx="66" cy="20" r="5" fill="#4ADE80"/>

  <text x="90" y="24"
        font-family="Consolas, monospace"
        font-size="11" fill="#94A3B8"
        letter-spacing="1.5">developer.profile</text>

  <text x="870" y="24" text-anchor="end"
        font-family="Consolas, monospace"
        font-size="10" fill="#4ADE80">● PROFILE LOADED</text>

  <!-- Section 1 -->
  <text x="30" y="76"
        font-family="Consolas, monospace"
        font-size="13" fill="#4ADE80">$ whoami</text>

  <text x="30" y="103"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="16" font-weight="600"
        fill="#E2E8F0">Full Stack Developer</text>

  <text x="30" y="124"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="13" fill="#94A3B8">Based in Indonesia — building across Web, AI &amp; Blockchain.</text>

  <!-- Divider -->
  <path d="M30 140 H870" stroke="#263B50" stroke-width="1"/>

  <!-- Section 2 -->
  <text x="30" y="164"
        font-family="Consolas, monospace"
        font-size="13" fill="#4ADE80">$ ls ./expertise</text>

  <text x="30" y="188"
        font-family="Consolas, monospace"
        font-size="12" fill="#60A5FA">01</text>
  <text x="55" y="188"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="13" fill="#E2E8F0">Web Development</text>

  <text x="260" y="188"
        font-family="Consolas, monospace"
        font-size="12" fill="#A78BFA">02</text>
  <text x="285" y="188"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="13" fill="#E2E8F0">AI &amp; Machine Learning</text>

  <text x="555" y="188"
        font-family="Consolas, monospace"
        font-size="12" fill="#4ADE80">03</text>
  <text x="580" y="188"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="13" fill="#E2E8F0">Crypto &amp; Market Analysis</text>

  <!-- Section 3 -->
  <text x="30" y="222"
        font-family="Consolas, monospace"
        font-size="13" fill="#4ADE80">$ cat ./philosophy.txt</text>

  <text x="30" y="247"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="15" fill="#C4B5FD"
        font-style="italic">"Turning ideas into practical, working solutions."</text>

  <!-- Footer -->
  <path d="M30 264 H870" stroke="#263B50" stroke-width="1"/>

  <text x="30" y="284"
        font-family="Consolas, monospace"
        font-size="11" fill="#64748B">GILGAMESH://PROFILE</text>

  <text x="870" y="284" text-anchor="end"
        font-family="Consolas, monospace"
        font-size="11" fill="#64748B">BUILD <tspan fill="#4ADE80">•</tspan> LEARN <tspan fill="#60A5FA">•</tspan> SHIP</text>

  <!-- Animated accent -->
  <rect x="30" y="298" width="110" height="2" fill="url(#lineg)">
    <animate attributeName="width"
             values="110;840;110"
             dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
