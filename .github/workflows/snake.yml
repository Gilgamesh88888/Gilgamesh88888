name: Generate Contribution Snake

on:
  # jalan otomatis setiap hari jam 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # bisa dijalankan manual dari tab Actions → Run workflow
  workflow_dispatch:
  # jalan setiap kali ada push ke branch main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # generate animasi snake dari contribution graph
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # push hasil SVG ke branch "output"
      # file akan tersedia di:
      # https://raw.githubusercontent.com/Gilgamesh88888/Gilgamesh88888/output/<nama-file>
      - name: Push snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
